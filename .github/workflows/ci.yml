name: Swift SDK
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift test
      - run: swift build -c release
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test on iPhone simulator
        run: xcodebuild -scheme dialt-swift-Package -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath .build/ios test CODE_SIGNING_ALLOWED=NO
